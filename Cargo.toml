[package]
authors = ["Eduardo Canellas <eduardocanellas98@gmail.com>"]
edition = "2024"
name = "cover_crime"
version = "0.1.0"
default-run = "main"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4.0", features = ["derive"] }
derive_more = "0.99"
fern = "0.6.0"
itertools = "0.10.0"
log = "0.4"
nom = "7"
ordered-float = "3"
petgraph = { version = "0.6", default-features = false }
rand = "0.8"
rand_pcg = "0.3"
thiserror = "1"
optimum = { git = "https://github.com/dbofmmbt/optimum" }
reqwest = { version = "0.13.1", features = ["blocking", "form"] }

[profile.release]
panic = "abort"

[dev-dependencies]
assert_cmd = "2"
